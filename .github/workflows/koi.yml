name: Generate Koi Animation

on:
  schedule:
    # Runs every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Koi SVG
        uses: dogue/gh-action-koi@main
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/koi.svg
            dist/koi-dark.svg?palette=github-dark

      - name: Deploy SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
